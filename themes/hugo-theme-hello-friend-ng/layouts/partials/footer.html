<footer class="footer">
    <div class="footer__inner">
        <div class="footer__content">
            {{ if .Site.Params.Author.name }}
                <span><a href="{{ .Site.BaseURL }}">{{ .Site.Params.Author.name }}</a></span>
            {{ end }}
            <span>{{ .Site.Copyright| safeHTML }}</span>
        </div>
    </div>
    <div class="footer__inner">
        <div class="footer__content">
        </div>
    </div>
    <script>
    // MathJax 3 (jsdelivr, https). Inline replacement for the old //yihui.name/js/math-code.js:
    // unwrap any math a renderer left inside <code> so v3 (which skips code/pre) still typesets it.
    (function () {
      var codes = document.getElementsByTagName('code'), i, code, text;
      for (i = 0; i < codes.length; i++) {
        code = codes[i];
        if (code.parentNode.tagName === 'PRE' || code.childElementCount !== 0) continue;
        text = code.textContent;
        if (/^\$[^$]+\$$/.test(text)) text = '\\(' + text.slice(1, -1) + '\\)';
        if (/^\\\([\s\S]+\\\)$/.test(text) || /^\\\[[\s\S]+\\\]$/.test(text) || /^\$\$[\s\S]+\$\$$/.test(text)) {
          var span = document.createElement('span');
          span.textContent = text;
          code.parentNode.replaceChild(span, code);
          i--;
        }
      }
    })();
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</footer>
